<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>達睿沖繩員工旅遊・行程規劃器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg: #EDE3C4;
    --surface: #FFFFFF;
    --ocean-deep: #0A5C74;
    --ocean: #17AEC9;
    --ocean-light: #B9EAF0;
    --coral: #F2A930;
    --ink: #123138;
    --ink-soft: #4C6E74;
    --line: #DACB9C;
    --leaf: #6E9271;
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  html{ width:100%; overflow-x:hidden; }

  body{
    margin:0;
    width:100%;
    overflow-x:hidden;
    background:
      linear-gradient(180deg, #BFE7F0 0%, #EDE3C4 38%),
      radial-gradient(circle at 92% 6%, rgba(23,174,201,0.16), transparent 40%),
      var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    padding: 24px 16px 60px;
  }

  .wrap{ max-width: 1180px; margin: 0 auto; }

  /* ---------- Header ---------- */
  header.hero{
    display:flex;
    flex-wrap: wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap: 16px;
    padding-bottom: 18px;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--ocean-deep);
    position: relative;
  }
  .hero-title-block{ display:flex; align-items:center; gap:14px; min-width:0; }
  .eyebrow{
    font-size: 12.5px;
    letter-spacing: 3px;
    color: var(--coral);
    font-weight:700;
    margin: 0 0 6px;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size: clamp(22px, 5vw, 34px);
    margin: 0;
    color: var(--ocean-deep);
    line-height:1.3;
  }
  .hero-sub{
    font-size: 13px;
    color: var(--ink-soft);
    text-align:right;
    max-width: 260px;
    line-height:1.6;
  }
  @media (max-width: 560px){
    .hero-sub{ text-align:left; max-width:100%; }
  }

  .export-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: var(--ocean-deep);
    color:#fff;
    border:none;
    border-radius: 10px;
    padding: 10px 16px;
    font-family:'Noto Sans TC', sans-serif;
    font-size: 13px;
    font-weight:700;
    cursor:pointer;
    white-space: nowrap;
    margin-top: 8px;
  }
  .export-btn:hover{ background: var(--ocean); }
  .export-btn svg{ width:15px; height:15px; }
  .wave{ display:block; width:100%; height:14px; margin: -2px 0 24px; }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns: 280px 1fr;
    gap: 22px;
    align-items:start;
    width:100%;
  }
  @media (max-width: 860px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar: 景點按鈕庫 ---------- */
  .panel{
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 2px 10px rgba(14,74,87,0.05);
  }
  .sidebar{ padding: 20px 18px; position: sticky; top: 20px; max-width:100%; }
  @media (max-width: 860px){
    .sidebar{ position: static; }
  }
  .sidebar h2{
    font-family:'Noto Serif TC', serif;
    font-size: 16px;
    margin: 0 0 4px;
    color: var(--ocean-deep);
  }
  .sidebar .hint{
    font-size:12px; color: var(--ink-soft); margin: 0 0 16px;
  }
  .region{ margin-bottom: 16px; }
  .region-label{
    font-size: 11.5px;
    font-weight:700;
    letter-spacing: 1.5px;
    color: var(--ocean);
    margin: 0 0 8px;
    display:flex; align-items:center; gap:6px;
  }
  .region-label::before{
    content:"";
    width:8px; height:8px; border-radius:50%;
    background: var(--ocean);
    display:inline-block;
  }
  .spot-btn{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    text-align:left;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
    font-family:'Noto Sans TC', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    cursor:pointer;
    margin-bottom: 7px;
    transition: all .15s ease;
  }
  .spot-btn:hover{
    background: var(--ocean-light);
    border-color: var(--ocean);
    transform: translateX(2px);
  }
  .spot-btn:active{ transform: translateX(2px) scale(.98); }
  .spot-btn .plus{
    color: var(--coral); font-weight:700; font-size:15px; flex-shrink:0;
  }
  .spot-btn-label{ flex:1; min-width:0; }
  .spot-btn-map{
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    width:24px; height:24px;
    border-radius: 6px;
    color: var(--coral);
    opacity: 0.6;
  }
  .spot-btn-map svg{ width:15px; height:15px; }
  .spot-btn-map:hover{ opacity:1; background: rgba(226,89,63,0.12); }

  .custom-add{
    margin-top: 6px;
    display:flex;
    gap:6px;
  }
  .custom-add input{
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-family:'Noto Sans TC', sans-serif;
    font-size:13px;
  }
  .custom-add button{
    background: var(--ocean-deep);
    color:#fff;
    border:none;
    border-radius:8px;
    padding: 0 14px;
    font-weight:700;
    cursor:pointer;
    font-size:13px;
  }
  .custom-add button:hover{ background: var(--ocean); }

  /* ---------- Main: tabs + timeline ---------- */
  .main-panel{ padding: 4px 0 0; }

  .tabs{
    display:flex;
    gap: 4px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--line);
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
  }
  .tab{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size: 15px;
    padding: 10px 16px 12px;
    background: transparent;
    border: none;
    cursor:pointer;
    color: var(--ink-soft);
    position:relative;
    top: 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .tab .day-en{
    display:block;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:400;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .tab.active{
    color: var(--ocean-deep);
    border-bottom: 3px solid var(--coral);
  }
  .tab .count{
    display:inline-block;
    min-width:16px;
    padding: 0 5px;
    margin-left:6px;
    background: var(--ocean-light);
    color: var(--ocean-deep);
    border-radius: 20px;
    font-size: 11px;
    font-weight:700;
  }
  .tab.active .count{ background: var(--coral); color:#fff; }

  .day-panel{
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 22px 24px 26px;
    min-height: 340px;
    box-shadow: 0 2px 10px rgba(14,74,87,0.05);
  }

  .map-box{
    margin-top: 16px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: 16px 16px 18px;
    box-shadow: 0 2px 10px rgba(14,74,87,0.05);
  }
  .map-box-title{
    display:flex; align-items:center; gap:6px;
    font-size: 12.5px; font-weight:700; color: var(--ocean-deep);
    margin: 0 0 10px;
  }
  .map-box-title svg{ width:15px; height:15px; color: var(--coral); flex-shrink:0; }
  .map-frame-wrap{
    width:100%; height: 380px;
    border-radius: 10px;
    overflow:hidden;
    border: 1px solid var(--line);
    background: var(--bg);
    position: relative;
  }
  #leafletMapContainer{ position:absolute; inset:0; width:100%; height:100%; }
  .map-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: var(--bg);
    z-index: 500;
    transition: opacity .2s ease;
    text-align:center;
    padding: 0 20px;
  }
  .map-overlay.hidden{ opacity:0; pointer-events:none; }
  .map-empty{ font-size:12.5px; color: var(--ink-soft); margin:0; line-height:1.6; }
  .map-empty.error{ color: var(--coral); font-weight:700; }
  @media (max-width: 560px){
    .map-frame-wrap{ height: 300px; }
  }

  .empty-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state svg{ width:56px; height:56px; margin-bottom: 12px; opacity:.5; }
  .empty-state p{ font-size: 13.5px; margin:0; }

  /* timeline */
  .timeline{ position:relative; padding-left: 6px; width:100%; }
  .stop{
    display:grid;
    grid-template-columns: 84px 20px 1fr auto;
    align-items:center;
    gap: 4px 10px;
    margin-bottom: 4px;
    width:100%;
  }
  @media (max-width: 520px){
    .stop{
      grid-template-columns: 20px 1fr;
      grid-template-areas:
        "line time"
        "line card"
        "line actions";
      row-gap: 6px;
    }
    .stop-time{ grid-area: time; }
    .stop-line{ grid-area: line; }
    .stop-card{ grid-area: card; }
    .stop-actions{ grid-area: actions; }
    .stop-time input{ text-align:left; width:110px; }
  }
  .stop-time input{
    width:100%;
    border:1px solid var(--line);
    border-radius: 8px;
    padding: 8px 8px;
    font-family:'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    text-align:center;
    color: var(--ocean-deep);
    font-weight:700;
  }
  .stop-time input::placeholder{ color: #B9C9C8; font-weight:400; }

  .stop-line{
    display:flex;
    flex-direction:column;
    align-items:center;
    height:100%;
    min-height: 54px;
  }
  .stop-dot{
    width:11px; height:11px; border-radius:50%;
    background: var(--ocean);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--ocean);
    flex-shrink:0;
    margin-top: 6px;
  }
  .stop-thread{
    width:2px;
    flex:1;
    background: var(--line);
    margin-top: 2px;
  }
  .stop:last-child .stop-thread{ background: transparent; }

  .stop-card{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight:500;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 8px;
    min-height: 20px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .stop-card:hover{
    background: var(--ocean-light);
    border-color: var(--ocean);
  }
  .stop-card .map-pin{
    flex-shrink:0;
    width:16px; height:16px;
    color: var(--coral);
    opacity: 0.7;
  }
  .stop-card:hover .map-pin{ opacity: 1; }

  .stop-actions{ display:flex; gap:4px; }
  .stop-actions button{
    width: 26px; height: 26px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor:pointer;
    font-size: 12px;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .stop-actions button:hover{ background: var(--ocean-light); color: var(--ocean-deep); }
  .stop-actions button.del:hover{ background: #FBE3DE; color: var(--coral); border-color: var(--coral); }

  footer.note{
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align:center;
  }
</style>
</head>

  // in-memory state only
  const state = {
    active: 0,
    days: [[], [], [], [], []] // each: {id, name, time}
  };
  let uid = 1;

  // ---------- Render sidebar ----------
  const regionListEl = document.getElementById('regionList');
  REGIONS.forEach(region => {
    const block = document.createElement('div');
    block.className = 'region';
    const label = document.createElement('p');
    label.className = 'region-label';
    label.textContent = region.label;
    block.appendChild(label);
    region.spots.forEach(spot => {
      const btn = document.createElement('button');
      btn.className = 'spot-btn';
      btn.innerHTML = `
        <span class="plus">＋</span>
        <span class="spot-btn-label">${spot}</span>
        <span class="spot-btn-map" title="開啟 Google 地圖">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </span>
      `;
      btn.addEventListener('click', (e) => {
        if (e.target.closest('.spot-btn-map')){
          e.stopPropagation();
          openMap(spot);
        } else {
          addStop(spot);
        }
      });
      block.appendChild(btn);
    });
    regionListEl.appendChild(block);
  });

  document.getElementById('customAddBtn').addEventListener('click', addCustom);
  document.getElementById('customInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addCustom();
  });
  function addCustom(){
    const input = document.getElementById('customInput');
    const val = input.value.trim();
    if (!val) return;
    addStop(val);
    input.value = '';
  }

  function addStop(name){
    state.days[state.active].push({ id: uid++, name, time: "" });
    renderDayPanel();
  }
  function removeStop(id){
    state.days[state.active] = state.days[state.active].filter(s => s.id !== id);
    renderDayPanel();
  }
  function moveStop(id, dir){
    const list = state.days[state.active];
    const idx = list.findIndex(s => s.id === id);
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= list.length) return;
    [list[idx], list[newIdx]] = [list[newIdx], list[idx]];
    renderDayPanel();
  }
  function openMap(name){
    const query = encodeURIComponent(name + ' 沖縄');
    window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
  }

  // ---------- Live map preview (Leaflet + OpenStreetMap, no API key) ----------
  // 已知景點座標優先查表；只有自訂景點（不在 COORDS 裡）才即時查詢
  const geocodeCache = {};
  let leafletMap = null;
  let markerLayer = null;
  let mapRequestToken = 0;
  const mapOverlayEl = document.getElementById('mapOverlay');

  function showMapMessage(text, isError){
    mapOverlayEl.innerHTML = `<p class="map-empty${isError ? ' error' : ''}">${text}</p>`;
    mapOverlayEl.classList.remove('hidden');
  }

  function initLeafletMap(){
    if (leafletMap) return true;
    if (typeof L === 'undefined'){
      showMapMessage('地圖元件載入失敗，可能是網路封鎖了 unpkg.com，請確認網路連線後重新整理頁面。', true);
      return false;
    }
    try{
      leafletMap = L.map('leafletMapContainer').setView([26.35, 127.9], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(leafletMap);
      markerLayer = L.layerGroup().addTo(leafletMap);
      return true;
    }catch(err){
      console.error('Leaflet init failed:', err);
      showMapMessage('地圖初始化失敗：' + err.message, true);
      return false;
    }
  }

  async function resolveLocation(name){
    if (COORDS[name]) return { lat: COORDS[name][0], lon: COORDS[name][1] };
    if (geocodeCache[name]) return geocodeCache[name];
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(name + ' 沖縄 Okinawa')}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data && data.length > 0){
        const loc = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        geocodeCache[name] = loc;
        return loc;
      }
    }catch(e){ console.error('geocode failed for', name, e); }
    return null;
  }

  async function updateMapPreview(){
    const list = state.days[state.active];
    const token = ++mapRequestToken;

    if (!list || list.length === 0){
      if (markerLayer) markerLayer.clearLayers();
      showMapMessage('加入景點後,這裡會顯示地圖跟路線', false);
      return;
    }

    const ok = initLeafletMap();
    if (!ok) return;

    showMapMessage('地圖載入中...', false);

    const locs = await Promise.all(list.map(s => resolveLocation(s.name)));
    if (token !== mapRequestToken) return;

    markerLayer.clearLayers();
    const pts = [];
    locs.forEach((loc, idx) => {
      if (loc){
        pts.push([loc.lat, loc.lon]);
        L.marker([loc.lat, loc.lon]).addTo(markerLayer).bindPopup(`${idx + 1}. ${list[idx].name}`);
      }
    });
    if (pts.length > 1){
      L.polyline(pts, { color: '#17AEC9', weight: 3, opacity: 0.7 }).addTo(markerLayer);
    }
    if (pts.length > 0){
      leafletMap.fitBounds(pts, { padding: [30, 30] });
      mapOverlayEl.classList.add('hidden');
      setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 60);
    } else {
      showMapMessage('找不到這幾個景點的地圖位置，建議點景點卡片直接用 Google 地圖搜尋。', true);
    }
  }

  function updateTime(id, val){
    const list = state.days[state.active];
    const item = list.find(s => s.id === id);
    if (item) item.time = val;
  }

  // ---------- Render tabs ----------
  const tabsEl = document.getElementById('tabs');
  function renderTabs(){
    tabsEl.innerHTML = '';
    DAYS.forEach((label, i) => {
      const tab = document.createElement('button');
      tab.className = 'tab' + (i === state.active ? ' active' : '');
      const count = state.days[i].length;
      tab.innerHTML = `${label}<span class="day-en">${DAY_EN[i]}</span>${count ? `<span class="count">${count}</span>` : ''}`;
      tab.addEventListener('click', () => {
        state.active = i;
        renderTabs();
        renderDayPanel();
      });
      tabsEl.appendChild(tab);
    });
  }

  // ---------- Render day panel ----------
  const dayPanelEl = document.getElementById('dayPanel');
  function renderDayPanel(){
    renderTabs();
    const list = state.days[state.active];
    dayPanelEl.innerHTML = '';

    if (list.length === 0){
      dayPanelEl.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="#17AEC9" stroke-width="1.5"><path d="M12 21c-4-4-8-7.5-8-12a8 8 0 0116 0c0 4.5-4 8-8 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
          <p>${DAYS[state.active]}目前還沒有景點，從左側點選加入吧</p>
        </div>`;
      updateMapPreview();
      return;
    }

    const timeline = document.createElement('div');
    timeline.className = 'timeline';

    list.forEach((stop, idx) => {
      const row = document.createElement('div');
      row.className = 'stop';
      row.innerHTML = `
        <div class="stop-time">
          <input type="text" placeholder="時間" value="${stop.time}" data-id="${stop.id}">
        </div>
        <div class="stop-line">
          <div class="stop-dot"></div>
          <div class="stop-thread"></div>
        </div>
        <div class="stop-card" data-act="map" data-id="${stop.id}" title="開啟 Google 地圖導航">
          <span>${stop.name}</span>
          <svg class="map-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="stop-actions">
          <button data-act="up" data-id="${stop.id}" title="上移">↑</button>
          <button data-act="down" data-id="${stop.id}" title="下移">↓</button>
          <button data-act="del" data-id="${stop.id}" class="del" title="刪除">×</button>
        </div>
      `;
      timeline.appendChild(row);
    });

    dayPanelEl.appendChild(timeline);

    // bind events
    timeline.querySelectorAll('.stop-time input').forEach(inp => {
      inp.addEventListener('input', e => updateTime(Number(e.target.dataset.id), e.target.value));
    });
    timeline.querySelectorAll('[data-act="up"]').forEach(b => b.addEventListener('click', e => moveStop(Number(e.target.dataset.id), -1)));
    timeline.querySelectorAll('[data-act="down"]').forEach(b => b.addEventListener('click', e => moveStop(Number(e.target.dataset.id), 1)));
    timeline.querySelectorAll('[data-act="del"]').forEach(b => b.addEventListener('click', e => removeStop(Number(e.target.dataset.id))));
    timeline.querySelectorAll('.stop-card[data-act="map"]').forEach(card => card.addEventListener('click', () => {
      const id = Number(card.dataset.id);
      const stop = state.days[state.active].find(s => s.id === id);
      if (stop) openMap(stop.name);
    }));

    updateMapPreview();
  }

  // ---------- Export read-only version ----------
  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function exportReadOnly(){
    const hasAny = state.days.some(d => d.length > 0);
    if (!hasAny){
      alert('目前還沒有排入任何景點，先安排一些行程再匯出唷！');
      return;
    }

    const routesJson = JSON.stringify(state.days.map(list => list.map(s => s.name))).replace(/</g, '\\u003c');
    const coordsJson = JSON.stringify(COORDS).replace(/</g, '\\u003c');

    const dayBlocks = state.days.map((list, i) => {
      const stopsHtml = list.length === 0
        ? `<p class="ro-empty">${escapeHtml(DAYS[i])}沒有安排行程</p>`
        : list.map(s => `
            <div class="ro-stop">
              <div class="ro-time">${s.time ? escapeHtml(s.time) : '－'}</div>
              <div class="ro-dotcol"><div class="ro-dot"></div><div class="ro-thread"></div></div>
              <a class="ro-card" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name + ' 沖縄')}" target="_blank" rel="noopener noreferrer">
                <span>${escapeHtml(s.name)}</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </a>
            </div>`).join('');
      const mapHtml = list.length === 0 ? '' : `<div class="ro-map" id="ro-map-${i}"></div>`;
      return `<section class="ro-day" id="ro-day-${i}">${mapHtml}${stopsHtml}</section>`;
    }).join('');

    const radios = DAYS.map((label, i) => `<input type="radio" name="roday" id="roday${i}" class="ro-radio"${i===0?' checked':''}>`).join('');

    const tabBtns = DAYS.map((label, i) => `<label for="roday${i}" class="ro-tab">${escapeHtml(label)}<span class="ro-en">${DAY_EN[i]}</span></label>`).join('');

    const showRules = DAYS.map((label, i) => `#roday${i}:checked ~ .ro-content #ro-day-${i}{ display:block; }`).join('\n  ');
    const activeRules = DAYS.map((label, i) => `#roday${i}:checked ~ .ro-tabbar label[for="roday${i}"]{ background:var(--ocean-deep); color:#fff; }`).join('\n  ');

    const html = `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>達睿沖繩員工旅遊・行程表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
<style>
  :root{ --bg:#EDE3C4; --surface:#FFFFFF; --ocean-deep:#0A5C74; --ocean:#17AEC9; --ocean-light:#B9EAF0; --coral:#F2A930; --ink:#123138; --ink-soft:#4C6E74; --line:#DACB9C; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: rgba(27,138,155,0.25); }
  body{ margin:0; background: linear-gradient(180deg, #BFE7F0 0%, #EDE3C4 30%), var(--bg); color:var(--ink); font-family:'Noto Sans TC',sans-serif; padding:24px 16px 90px; }
  .wrap{ max-width:720px; margin:0 auto; }
  h1{ font-family:'Noto Serif TC',serif; font-weight:900; font-size:24px; color:var(--ocean-deep); margin:0 0 4px; }
  .sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .ro-radio{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  .ro-day{ display:none; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .ro-map{ width:100%; height:220px; border-radius:10px; overflow:hidden; border:1px solid var(--line); margin-bottom:16px; background:var(--bg); }
  .ro-empty{ text-align:center; color:var(--ink-soft); padding:30px 0; font-size:13.5px; margin:0; }
  .ro-stop{ display:grid; grid-template-columns:60px 20px 1fr; gap:4px 10px; align-items:center; margin-bottom:4px; }
  .ro-time{ font-size:12.5px; font-weight:700; color:var(--ocean-deep); text-align:center; }
  .ro-dotcol{ display:flex; flex-direction:column; align-items:center; height:100%; min-height:50px; }
  .ro-dot{ width:11px; height:11px; border-radius:50%; background:var(--ocean); border:2px solid #fff; box-shadow:0 0 0 2px var(--ocean); margin-top:6px; flex-shrink:0; }
  .ro-thread{ width:2px; flex:1; background:var(--line); margin-top:2px; }
  .ro-stop:last-child .ro-thread{ background:transparent; }
  .ro-card{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; font-weight:500; display:flex; align-items:center; justify-content:space-between; gap:8px; text-decoration:none; color:var(--ink); }
  .ro-card:active{ background:var(--ocean-light); border-color:var(--ocean); }
  .ro-card svg{ width:15px; height:15px; color:var(--coral); flex-shrink:0; opacity:.8; }
  footer{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:16px; }

  .ro-tabbar{
    display:flex; gap:4px; margin-top:18px;
    padding:8px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    position:sticky; bottom:12px; box-shadow:0 4px 16px rgba(14,74,87,0.12);
  }
  .ro-tab{
    flex:1; text-align:center;
    font-family:'Noto Serif TC',serif; font-weight:700; font-size:12.5px;
    padding:10px 4px; color:var(--ink-soft); border-radius:10px; cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .ro-tab .ro-en{ display:block; font-family:'Noto Sans TC',sans-serif; font-weight:400; font-size:8.5px; letter-spacing:1px; margin-top:1px; }
  ${showRules}
  ${activeRules}
</style>
</head>
<body>
<div class="wrap">
  <h1>達睿沖繩員工旅遊・行程表</h1>
  <p class="sub">2026/10/26－10/30・點景點卡片可直接開啟 Google 地圖導航</p>

  ${radios}
  <div class="ro-content">
    ${dayBlocks}
  </div>

  <div class="ro-tabbar">
    ${tabBtns}
  </div>

  <footer>此為唯讀行程表，如需調整請聯繫行程規劃人員</footer>
</div>
<script>
  var ROUTES = ${routesJson};
  var COORDS = ${coordsJson};
  var mapEntries = {};
  var geoCache = {};

  function resolveLocation(name){
    if (COORDS[name]) return Promise.resolve({ lat: COORDS[name][0], lon: COORDS[name][1] });
    if (geoCache[name]) return Promise.resolve(geoCache[name]);
    var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(name + ' 沖縄 Okinawa');
    return fetch(url).then(function(r){ return r.json(); }).then(function(data){
      if (data && data.length){
        var loc = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
        geoCache[name] = loc;
        return loc;
      }
      return null;
    }).catch(function(err){ console.error('geocode failed', err); return null; });
  }

  function renderDayMap(i){
    if (typeof L === 'undefined') return;
    var names = ROUTES[i];
    if (!names || names.length === 0) return;
    var containerId = 'ro-map-' + i;
    var el = document.getElementById(containerId);
    if (!el) return;

    if (!mapEntries[i]){
      try{
        var m = L.map(containerId).setView([26.35, 127.9], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
        }).addTo(m);
        var layer = L.layerGroup().addTo(m);
        mapEntries[i] = { map: m, layer: layer, done: false };
      }catch(err){ console.error('map init failed', err); return; }
    }
    var entry = mapEntries[i];
    setTimeout(function(){ if (entry.map) entry.map.invalidateSize(); }, 60);
    if (entry.done) return;
    entry.done = true;

    Promise.all(names.map(resolveLocation)).then(function(locs){
      entry.layer.clearLayers();
      var pts = [];
      locs.forEach(function(loc, idx){
        if (loc){
          pts.push([loc.lat, loc.lon]);
          L.marker([loc.lat, loc.lon]).addTo(entry.layer).bindPopup((idx + 1) + '. ' + names[idx]);
        }
      });
      if (pts.length > 1){
        L.polyline(pts, { color: '#17AEC9', weight: 3, opacity: 0.7 }).addTo(entry.layer);
      }
      if (pts.length > 0){
        entry.map.fitBounds(pts, { padding: [30, 30] });
      }
    });
  }

  renderDayMap(0);
  for (var d = 0; d < ROUTES.length; d++){
    (function(idx){
      var radio = document.getElementById('roday' + idx);
      if (radio) radio.addEventListener('change', function(){ renderDayMap(idx); });
    })(d);
  }
<\/script>
</body>
</html>`;

    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '達睿沖繩員工旅遊行程表_唯讀版.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  document.getElementById('exportBtn').addEventListener('click', exportReadOnly);

  renderTabs();
  renderDayPanel();
</script>
</body>
</html>
